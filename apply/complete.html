<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Complete — Minerva Admissions</title>

  <!-- Mood flash-prevention -->
  <script>
    (function () {
      try {
        var m = localStorage.getItem('minerva-mood');
        if (m) document.documentElement.setAttribute('data-mood', m);
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/design-system.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/freddy.css">

  <style>
    /* ── Full-screen celebration layout ── */
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: #000000;
      display:    flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow:   hidden;
    }

    canvas#confetti-canvas {
      position:       fixed;
      inset:          0;
      width:          100%;
      height:         100%;
      pointer-events: none;
      z-index:        0;
    }

    /* ── Celebration card ── */
    .celebration {
      position:   relative;
      z-index:    1;
      text-align: center;
      padding:    var(--sp-9) var(--sp-7);
      max-width:  560px;
    }

    /* ── Freddy happy spin ── */
    #cx-freddy {
      width:  100px;
      height: 100px;
      margin: 0 auto var(--sp-6);
      animation: cx-arrive 0.75s var(--ease-spring, cubic-bezier(0.34,1.56,0.64,1)) 0.2s both;
    }

    @keyframes cx-arrive {
      from { transform: scale(0) rotate(-180deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg);    opacity: 1; }
    }

    #cx-freddy svg {
      width:  100%;
      height: 100%;
      animation: cx-idle-bob 3s ease-in-out 1.2s infinite;
    }

    @keyframes cx-idle-bob {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-6px); }
    }

    /* ── Text ── */
    .cx-heading {
      font-family:    var(--font-display);
      font-size:      clamp(2.75rem, 8vw, 4.5rem);
      font-weight:    700;
      color:          #ffffff;
      letter-spacing: -0.02em;
      line-height:    1.1;
      margin:         0 0 var(--sp-5);
      animation:      cx-fade-up 0.6s ease 0.6s both;
    }

    .cx-sub {
      font-family: var(--font-body);
      font-size:   clamp(1rem, 2.5vw, 1.2rem);
      color:       var(--dark-text-2, #9B99A8);
      line-height: 1.65;
      margin:      0 auto var(--sp-7);
      animation:   cx-fade-up 0.6s ease 0.8s both;
    }

    .cx-home-link {
      display:        inline-block;
      font-family:    var(--font-body);
      font-size:      14px;
      color:          var(--color-gold, #C9A84C);
      text-decoration: none;
      letter-spacing: 0.02em;
      animation:      cx-fade-up 0.6s ease 1.0s both;
      transition:     opacity 0.2s ease;
    }
    .cx-home-link:hover { opacity: 0.7; color: var(--color-gold, #C9A84C); text-decoration: none; }

    @keyframes cx-fade-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- OS Detection -->
  <script>
    (function () {
      var ua  = navigator.userAgent;
      var cls = /iPhone|iPad|iPod|Android/i.test(ua) ? 'os-mobile'
              : /Mac/i.test(ua)                       ? 'os-mac'
              : /Win/i.test(ua)                       ? 'os-win'
              : /Linux/i.test(ua)                     ? 'os-linux'
              : '';
      if (cls) document.documentElement.classList.add(cls);
    })();
  </script>

  <!-- Gold confetti canvas -->
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <!-- Celebration content -->
  <div class="celebration">

    <!-- Freddy celebrating -->
    <div id="cx-freddy" aria-hidden="true">
      <svg viewBox="0 0 60 60" overflow="visible" xmlns="http://www.w3.org/2000/svg">
        <!-- Party hat — always shown on complete page -->
        <polygon points="30,1 23,14 37,14" fill="#C9A84C"/>
        <polygon points="30,2 25,13 35,13" fill="#B8963E" opacity="0.5"/>
        <circle  cx="30" cy="1.5" r="1.5" fill="#F5F4F0"/>
        <circle  cx="24" cy="13"  r="1.3" fill="#FF3B30"/>
        <circle  cx="36" cy="13"  r="1.3" fill="#30D158"/>
        <line x1="22" y1="14" x2="38" y2="14" stroke="#B8963E" stroke-width="1"/>
        <!-- Tail (wagging) -->
        <path d="M40,48 C52,42 58,32 53,22" fill="none" stroke="#DDDBD4"
              stroke-width="5.5" stroke-linecap="round"
              style="transform-box:fill-box;transform-origin:left bottom;
                     animation:cx-tail-wag 0.4s ease-in-out 1.2s infinite alternate"/>
        <!-- Body -->
        <polygon points="18,53 30,49 42,53 40,34 20,34" fill="#F0EFE9"/>
        <polygon points="22,34 38,34 36,44 24,44" fill="#E6E4DE" opacity="0.6"/>
        <!-- Head -->
        <circle cx="30" cy="21" r="13" fill="#F5F4F0"/>
        <polygon points="17,21 30,8 30,34" fill="#ECEAE4" opacity="0.4"/>
        <!-- Left ear (perked up) -->
        <polygon points="16,16 21,6 27,15" fill="#F5F4F0"/>
        <polygon points="18,15.5 21,8 25.5,15" fill="#F0BFC8" opacity="0.75"/>
        <!-- Right ear (perked up) -->
        <polygon points="33,15 39,6 44,16" fill="#F5F4F0"/>
        <polygon points="34.5,15 39,8 42,15.5" fill="#F0BFC8" opacity="0.75"/>
        <!-- Eyes — wide open (excited) -->
        <circle cx="24.5" cy="19.5" r="4.8" fill="#1A1A2E"/>
        <circle cx="35.5" cy="19.5" r="4.8" fill="#1A1A2E"/>
        <circle cx="25.9" cy="18.1" r="1.8" fill="white"/>
        <circle cx="36.9" cy="18.1" r="1.8" fill="white"/>
        <!-- Happy mouth (bigger smile) -->
        <ellipse cx="30" cy="25.5" rx="2" ry="1.4" fill="#F0A0B5"/>
        <path d="M26.5,27.5 Q30,31 33.5,27.5"
              fill="none" stroke="#D4A0AC" stroke-width="1.1" stroke-linecap="round"/>
        <!-- Whiskers -->
        <line x1="12" y1="24"   x2="26" y2="25.5" stroke="#C8C6BE" stroke-width="0.65" opacity="0.8"/>
        <line x1="11" y1="26.5" x2="25" y2="27.2" stroke="#C8C6BE" stroke-width="0.65" opacity="0.8"/>
        <line x1="34" y1="25.5" x2="48" y2="24"   stroke="#C8C6BE" stroke-width="0.65" opacity="0.8"/>
        <line x1="35" y1="27.2" x2="49" y2="26.5" stroke="#C8C6BE" stroke-width="0.65" opacity="0.8"/>
        <!-- Gold collar -->
        <path d="M19,32 Q30,36 41,32" fill="none" stroke="#C9A84C" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="30" cy="35" r="2.5" fill="#B8963E"/>
        <line   x1="30" y1="36.5" x2="30" y2="38" stroke="#8A6B20" stroke-width="0.9"/>
      </svg>
    </div>

    <h1 class="cx-heading">Everything is in.</h1>
    <p class="cx-sub">Your application is with us. We read every word.</p>
    <a href="../index.html" class="cx-home-link">← Back to Minerva</a>

  </div>

  <!-- Tail wag keyframe (inline so it doesn't require external CSS) -->
  <style>
    @keyframes cx-tail-wag {
      from { transform: rotate(-8deg);  }
      to   { transform: rotate(12deg);  }
    }
  </style>

  <!-- Canvas confetti -->
  <script>
    (function () {
      var canvas = document.getElementById('confetti-canvas');
      var ctx    = canvas.getContext('2d');

      function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var COLORS = ['#C9A84C','#F0D080','#ffffff','#2D3561','#B8963E','#E8E6E0','#F5F4F0'];

      /* Generate pieces — mix of rectangles and small squares */
      var pieces = [];
      var COUNT  = 140;
      for (var i = 0; i < COUNT; i++) {
        pieces.push({
          x:     Math.random() * window.innerWidth,
          y:     Math.random() * -window.innerHeight * 1.2,
          w:     Math.random() * 8  + 4,
          h:     Math.random() * 14 + 5,
          color: COLORS[Math.floor(Math.random() * COLORS.length)],
          speed: Math.random() * 1.4 + 0.6,
          spin:  (Math.random() - 0.5) * 0.12,
          angle: Math.random() * Math.PI * 2,
          drift: (Math.random() - 0.5) * 0.6,
          sway:  Math.random() * 0.03 + 0.01,
          swayOff: Math.random() * 100,
        });
      }

      var tick = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        tick++;

        pieces.forEach(function (p) {
          p.angle += p.spin;
          p.y     += p.speed;
          p.x     += Math.sin(tick * p.sway + p.swayOff) * p.drift;

          if (p.y > canvas.height + 20) {
            p.y = -20;
            p.x = Math.random() * canvas.width;
          }

          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = 0.88;
          ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
          ctx.restore();
        });

        requestAnimationFrame(draw);
      }

      draw();
    })();
  </script>

  <script src="../js/mood.js"></script>
  <script src="../js/freddy.js"></script>

</body>
</html>
